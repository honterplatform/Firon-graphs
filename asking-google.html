<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nobody's Asking Google</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: #000;
    letter-spacing: -0.01em;
  }

  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: stretch; justify-content: center;
    padding: clamp(6px, 1.2vh, 10px);
  }
  .shell {
    width: 100%; height: 100%;
    max-width: 1080px;
    background: #F2F2F2;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    padding: clamp(9px, 1.5vh, 13px);
    display: flex; flex-direction: column;
    gap: clamp(7px, 1.2vh, 11px);
    overflow: hidden;
  }

  .top {
    display: flex; align-items: center; gap: clamp(8px, 1.2vw, 14px);
    flex-shrink: 0; min-width: 0; overflow: hidden;
  }
  .lg {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: clamp(10px, 1.35vh, 11.5px);
    font-weight: 500;
    color: rgba(0,0,0,0.6);
    white-space: nowrap; flex-shrink: 0;
  }
  .lg svg { width: clamp(11px, 1.55vh, 13px); height: clamp(11px, 1.55vh, 13px); }
  .sw { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .rule { width: 1px; height: 13px; background: rgba(0,0,0,0.12); flex-shrink: 0; }
  .ai-group { display: flex; align-items: center; gap: clamp(7px, 1vw, 12px); min-width: 0; overflow: hidden; }

  .panel {
    flex: 1; min-height: 0;
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the two territory labels — fixed corners, because a 100% stack
     guarantees Google owns bottom-left and AI owns top-right */
  .note {
    position: absolute;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(8.5px, 1.2vh, 10px);
    font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap;
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  .note.on { opacity: 1; }
  .note.rank {
    left: clamp(38px, 7vw, 62px);
    bottom: clamp(26px, 5vh, 38px);
    color: rgba(0,0,0,0.75);
    background: rgba(255,255,255,0.86);
  }
  .note.absent {
    right: clamp(44px, 7vw, 66px);
    top: clamp(10px, 2.4vh, 18px);
    color: #fff;
    background: rgba(251,59,36,0.92);
  }

  .foot {
    display: flex; align-items: center; gap: clamp(7px, 1vw, 12px);
    flex-shrink: 0; min-width: 0; overflow: hidden;
  }
  .delta {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(9px, 1.25vh, 10.5px);
    font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .delta b { font-size: clamp(11px, 1.7vh, 14px); font-weight: 500; font-variant-numeric: tabular-nums; }
  .delta.down b { color: rgba(0,0,0,0.8); }
  .delta.up b { color: #FB3B24; }
  .span {
    margin-left: auto;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: rgba(0,0,0,0.28);
    white-space: nowrap;
  }

  @media (max-width: 620px), (max-aspect-ratio: 1/1) {
    .lg span.nm { display: none; }
    .lg.solo span.nm { display: inline; }
    .span { display: none; }
    .note { font-size: 8px; padding: 3px 6px; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="shell">

    <header class="top" id="legend"></header>

    <section class="panel">
      <canvas id="c"></canvas>
      <span class="note rank" id="noteRank">Your #1 ranks here</span>
      <span class="note absent" id="noteAbsent">You're not in the answer here</span>
    </section>

    <footer class="foot">
      <span class="delta down">Asked Google <b id="dG">0</b> pts</span>
      <span class="delta up">Asked AI <b id="dA">0</b> pts</span>
      <span class="span" id="spanLbl"></span>
    </footer>

  </section>
</main>

<script>
(function () {
  /* ============================================================
     DATA — placeholder shape, not sourced figures. Google and the
     assistants must sum to 100 in every year (it is a 100% stack).
     Replace before publishing; put the citation in SOURCE.
     ============================================================ */
  var YEARS  = ['2022', '2023', '2024', '2025', '2026'];
  var GOOGLE = [91, 85, 76, 63, 47];
  var SOURCE = '';

  var OPENAI = 'M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.073zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z';
  var GEMINI = 'M12 24A14.304 14.304 0 0 0 0 12 14.304 14.304 0 0 0 12 0a14.305 14.305 0 0 0 12 12 14.305 14.305 0 0 0-12 12';
  var CLAUDE = 'M4.709 15.955l4.72-2.647.079-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.607.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z';
  var PPLX = 'M19.785 0v7.272H22.5V17.62h-2.935V24l-7.037-6.194v6.145h-1.091v-6.152L4.399 24v-6.465H1.5V7.188h2.808V0l7.129 6.135V.11h1.091v6.036L19.785 0Zm-7.257 9.044v7.319l5.946 5.234V14.44l-5.946-5.397Zm-1.099-.03-5.946 5.398v7.174l5.946-5.234V9.015ZM2.59 8.28v8.264h1.809v-4.489l4.11-3.775H2.59Zm13.652 0 4.11 3.775v4.489h1.057V8.28h-5.167ZM5.49 2.476v4.796h5.29L5.49 2.476Zm13.204 0L13.42 7.272h5.274V2.476Z';

  /* stacked bottom-up: Google first, then the assistants pressing down on it */
  var ASSISTANTS = [
    { name: 'ChatGPT',    path: OPENAI, tint: '#FB3B24', data: [6, 9, 13, 19, 26] },
    { name: 'Gemini',     path: GEMINI, tint: '#FD6A58', data: [1, 3,  5,  8, 12] },
    { name: 'Claude',     path: CLAUDE, tint: '#FE9384', data: [1, 2,  4,  6,  9] },
    { name: 'Perplexity', path: PPLX,   tint: '#FFBEB4', data: [1, 1,  2,  4,  6] }
  ];

  var ACCENT = '#FB3B24';
  var N = YEARS.length;
  var AI_TOTAL = YEARS.map(function (_, i) {
    return ASSISTANTS.reduce(function (s, a) { return s + a.data[i]; }, 0);
  });

  /* cumulative upper boundary of each band */
  var SERIES = [{ data: GOOGLE }].concat(ASSISTANTS);
  var CUM = SERIES.map(function (_, k) {
    return YEARS.map(function (_, i) {
      var t = 0;
      for (var j = 0; j <= k; j++) t += SERIES[j].data[i];
      return t;
    });
  });

  /* the year the Google band drops through half of all buying questions */
  var CROSS = (function () {
    for (var i = 0; i < N - 1; i++) {
      var d0 = GOOGLE[i] - 50, d1 = GOOGLE[i + 1] - 50;
      if (d0 === 0) return { i: i };
      if ((d0 > 0) !== (d1 > 0)) return { i: i + d0 / (d0 - d1) };
    }
    return null;
  })();

  var HAS_P2D = (typeof Path2D !== 'undefined');
  if (HAS_P2D) ASSISTANTS.forEach(function (a) { a.p2d = new Path2D(a.path); });

  var legend = document.getElementById('legend');
  legend.innerHTML =
    '<span class="lg solo"><i class="sw" style="background:rgba(0,0,0,0.5)"></i><span class="nm">Asked Google</span></span>' +
    '<span class="rule"></span>' +
    '<span class="ai-group">' +
    ASSISTANTS.map(function (a) {
      return '<span class="lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + a.path +
             '" fill="' + a.tint + '"/></svg><span class="nm">' + a.name + '</span></span>';
    }).join('') + '</span>';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dG = document.getElementById('dG');
  var dA = document.getElementById('dA');
  var noteRank = document.getElementById('noteRank');
  var noteAbsent = document.getElementById('noteAbsent');
  document.getElementById('spanLbl').textContent =
    SOURCE ? SOURCE : YEARS[0] + ' – ' + YEARS[N - 1];

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.max(1, W * dpr);
    canvas.height = Math.max(1, H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function pads() {
    var fs = Math.max(8.5, Math.min(11, H * 0.05));
    return { l: fs * 3.1, r: fs * 3.0, t: fs * 0.9, b: fs * 2.5, fs: fs };
  }
  function X(i, p) { return p.l + (i / (N - 1)) * (W - p.l - p.r); }
  function Y(v, p) { return p.t + (1 - v / 100) * (H - p.t - p.b); }

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function seg(e, a, b) { return clamp01((e - a) / (b - a)); }
  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function bandPath(lower, upper, p) {
    ctx.beginPath();
    ctx.moveTo(X(0, p), Y(lower[0], p));
    for (var i = 1; i < N; i++) ctx.lineTo(X(i, p), Y(lower[i], p));
    for (var j = N - 1; j >= 0; j--) ctx.lineTo(X(j, p), Y(upper[j], p));
    ctx.closePath();
  }
  function drawLogo(p2d, x, y, size, color) {
    ctx.save();
    ctx.translate(x, y - size / 2);
    ctx.scale(size / 24, size / 24);
    ctx.fillStyle = color;
    ctx.fill(p2d);
    ctx.restore();
  }
  function declutter(items, minGap, lo, hi) {
    if (items.length > 1) minGap = Math.min(minGap, (hi - lo) / (items.length - 1));
    items.sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < items.length; i++) {
      if (items[i].y - items[i - 1].y < minGap) items[i].y = items[i - 1].y + minGap;
    }
    var over = items[items.length - 1].y - hi;
    if (over > 0) for (var k = items.length - 1; k >= 0; k--) {
      items[k].y -= over;
      if (k > 0 && items[k].y - items[k - 1].y >= minGap) break;
    }
    if (items[0].y < lo) {
      var under = lo - items[0].y;
      for (var j = 0; j < items.length; j++) items[j].y += under;
    }
    return items;
  }

  function draw(e) {
    var p = pads();
    ctx.clearRect(0, 0, W, H);

    var aGrid = ease(seg(e, 0, 350));
    var sweep = ease(seg(e, 250, 1900));
    var aCross = ease(seg(e, 1950, 2350));
    var aEnd  = ease(seg(e, 2150, 2550));
    var aOut  = 1 - seg(e, 7700, 8100);
    ctx.globalAlpha = aOut;

    /* bands, revealed by a left-to-right wipe */
    ctx.save();
    ctx.beginPath();
    ctx.rect(p.l, p.t - 2, (W - p.l - p.r) * sweep, H - p.t - p.b + 4);
    ctx.clip();

    var zero = YEARS.map(function () { return 0; });
    bandPath(zero, CUM[0], p);
    ctx.fillStyle = 'rgba(0,0,0,0.075)';
    ctx.fill();

    for (var k = 1; k < SERIES.length; k++) {
      bandPath(CUM[k - 1], CUM[k], p);
      ctx.fillStyle = SERIES[k].tint;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* the falling Google boundary — the one hard line in the chart */
    ctx.beginPath();
    ctx.moveTo(X(0, p), Y(GOOGLE[0], p));
    for (var i = 1; i < N; i++) ctx.lineTo(X(i, p), Y(GOOGLE[i], p));
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    /* axes */
    ctx.font = '500 ' + (p.fs * 0.92) + 'px "Geist Mono", ui-monospace, monospace';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    [0, 50, 100].forEach(function (v) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * aGrid).toFixed(3) + ')';
      ctx.fillText(v + '%', p.l - p.fs * 0.7, Y(v, p));
    });
    var everyOther = (W - p.l - p.r) / N < 46;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    YEARS.forEach(function (yr, i) {
      if (everyOther && i % 2 === 1 && i !== N - 1) return;
      ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * aGrid).toFixed(3) + ')';
      ctx.fillText(yr, X(i, p), H - p.b + p.fs * 0.55);
    });

    /* the moment Google stops being where most buying questions go */
    if (CROSS && aCross > 0) {
      ctx.save();
      ctx.globalAlpha = aOut * aCross;
      var cx2 = X(CROSS.i, p), cy = Y(50, p);
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx2, cy); ctx.lineTo(cx2, H - p.b);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(cx2, cy, 4.5 + (1 - aCross) * 6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = ACCENT; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    /* assistant marks at the right edge, one per band */
    if (aEnd > 0) {
      var ex = X(N - 1, p) + p.fs * 0.5;
      var ls = p.fs * 1.2;
      var rows = ASSISTANTS.map(function (a, k) {
        var lo = CUM[k][N - 1], hi = CUM[k + 1][N - 1];
        return { y: Y((lo + hi) / 2, p), p2d: a.p2d, tint: a.tint };
      });
      declutter(rows, p.fs * 1.5, p.t + ls / 2, H - p.b - ls / 2);
      ctx.save();
      ctx.globalAlpha = aOut * aEnd;
      rows.forEach(function (r) {
        if (r.p2d && HAS_P2D) drawLogo(r.p2d, ex, r.y, ls, r.tint);
        else { ctx.fillStyle = r.tint; ctx.fillRect(ex, r.y - ls * 0.3, ls * 0.75, ls * 0.6); }
      });
      ctx.restore();
    }

    ctx.globalAlpha = 1;

    var lit = e > 2300 && e < 7700;
    noteRank.classList.toggle('on', lit);
    noteAbsent.classList.toggle('on', lit);

    var dp = ease(seg(e, 1900, 2700));
    var gd = (GOOGLE[N - 1] - GOOGLE[0]) * dp;
    var ad = (AI_TOTAL[N - 1] - AI_TOTAL[0]) * dp;
    dG.textContent = (gd > 0 ? '+' : '−') + Math.abs(Math.round(gd));
    dA.textContent = (ad >= 0 ? '+' : '−') + Math.abs(Math.round(ad));
  }

  var TOTAL = 8100, start = null;
  function frame(now) {
    if (start === null) start = now;
    draw((now - start) % TOTAL);
    requestAnimationFrame(frame);
  }
  function boot() { resize(); if (reduce) draw(6000); else requestAnimationFrame(frame); }
  window.addEventListener('resize', function () { resize(); if (reduce) draw(6000); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
})();
</script>
</body>
</html>
