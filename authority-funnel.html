<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authority Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: #000;
    letter-spacing: -0.01em;
  }

  .card {
    width: 100%;
    height: 100%;
    background: #F2F2F2;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: clamp(10px, 3vh, 14px);
    padding: clamp(8px, 3vh, 12px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 2.5vh, 12px);
    overflow: hidden;
  }

  .panel {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }

  .p-label {
    position: absolute;
    top: clamp(7px, 8%, 12px);
    left: clamp(10px, 5%, 14px);
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1px;
    pointer-events: none;
  }
  .p-title {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(9px, 9%, 11px);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.1;
  }
  .p-sub {
    font-size: clamp(9px, 8.5%, 11px);
    font-weight: 500;
    line-height: 1.15;
  }
  .panel.left .p-title { color: rgba(0,0,0,0.45); }
  .panel.left .p-sub { color: rgba(0,0,0,0.4); }
  .panel.right .p-title { color: #FB3B24; }
  .panel.right .p-sub { color: #000; }

  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  @media (max-aspect-ratio: 3/2) {
    .card { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="panel left">
    <div class="p-label">
      <div class="p-title">Scattered blogs</div>
      <div class="p-sub">Authority dissipating</div>
    </div>
    <canvas id="cL"></canvas>
  </div>
  <div class="panel right">
    <div class="p-label">
      <div class="p-title">Category-first</div>
      <div class="p-sub">Authority funnelled &#8594; money page</div>
    </div>
    <canvas id="cR"></canvas>
  </div>
</div>

<script>
(function () {
  var ACCENT = '#FB3B24';
  var dpr = window.devicePixelRatio || 1;

  function setup(canvas) {
    var ctx = canvas.getContext('2d');
    function resize() {
      var r = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, r.width * dpr);
      canvas.height = Math.max(1, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: r.width, h: r.height };
    }
    return { ctx: ctx, resize: resize, dims: resize() };
  }

  function roundedNode(ctx, x, y, w, h, r, stroke, fill, lw) {
    ctx.beginPath();
    ctx.moveTo(x - w/2 + r, y - h/2);
    ctx.arcTo(x + w/2, y - h/2, x + w/2, y + h/2, r);
    ctx.arcTo(x + w/2, y + h/2, x - w/2, y + h/2, r);
    ctx.arcTo(x - w/2, y + h/2, x - w/2, y - h/2, r);
    ctx.arcTo(x - w/2, y - h/2, x + w/2, y - h/2, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }

  /* ================= LEFT: scattered, dissipating ================= */
  var L = setup(document.getElementById('cL'));
  var lNodes = [];   // relative positions 0..1
  var lNodeDefs = [
    {x:0.30,y:0.34},{x:0.62,y:0.26},{x:0.44,y:0.60},
    {x:0.72,y:0.62},{x:0.24,y:0.72},{x:0.82,y:0.40}
  ];
  var lParticles = [];
  var lLast = 0;

  function drawLeft(now) {
    var w = L.dims.w, h = L.dims.h;
    L.ctx.clearRect(0, 0, w, h);

    // nodes as little "blog" cards, isolated (no connections, no base)
    lNodeDefs.forEach(function (n) {
      var x = n.x * w, y = n.y * h;
      var nw = Math.max(14, w * 0.075), nh = nw * 0.72;
      roundedNode(L.ctx, x, y, nw, nh, 3, 'rgba(0,0,0,0.18)', '#FFFFFF', 1);
      // header line + text lines
      L.ctx.strokeStyle = 'rgba(0,0,0,0.16)';
      L.ctx.lineWidth = 1.5;
      L.ctx.beginPath();
      L.ctx.moveTo(x - nw/2 + 4, y - nh/2 + 5);
      L.ctx.lineTo(x + nw/2 - 4, y - nh/2 + 5);
      L.ctx.stroke();
      L.ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      L.ctx.lineWidth = 1;
      L.ctx.beginPath();
      L.ctx.moveTo(x - nw/2 + 4, y + 1);
      L.ctx.lineTo(x + nw/2 - 6, y + 1);
      L.ctx.stroke();

      // occasionally emit an authority particle that drifts away and fades
      if (now - (n._t || 0) > 900 + (n.x * 700)) {
        n._t = now;
        var ang = Math.random() * Math.PI * 2;
        lParticles.push({
          x: x, y: y,
          vx: Math.cos(ang) * (0.25 + Math.random() * 0.35),
          vy: Math.sin(ang) * (0.25 + Math.random() * 0.35) - 0.15,
          life: 1
        });
      }
    });

    // particles dissipating
    for (var i = lParticles.length - 1; i >= 0; i--) {
      var p = lParticles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.012;
      if (p.life <= 0) { lParticles.splice(i, 1); continue; }
      L.ctx.beginPath();
      L.ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
      L.ctx.fillStyle = 'rgba(0,0,0,' + (0.22 * p.life).toFixed(3) + ')';
      L.ctx.fill();
    }

    requestAnimationFrame(drawLeft);
  }

  /* ================= RIGHT: clusters funnel into money page ============ */
  var R = setup(document.getElementById('cR'));
  var clusterDefs = [
    {x:0.16,y:0.24},{x:0.16,y:0.50},{x:0.16,y:0.76},
    {x:0.38,y:0.36},{x:0.38,y:0.64}
  ];
  var money = {x:0.76, y:0.5};
  var rParticles = [];
  var pulse = 0;

  function drawRight(now) {
    var w = R.dims.w, h = R.dims.h;
    R.ctx.clearRect(0, 0, w, h);

    var mx = money.x * w, my = money.y * h;
    var mr = Math.max(13, Math.min(w, h) * 0.11);

    // foundation base line under the money page
    R.ctx.strokeStyle = 'rgba(0,0,0,0.14)';
    R.ctx.lineWidth = 1.5;
    R.ctx.beginPath();
    R.ctx.moveTo(mx - mr * 1.7, my + mr * 1.55);
    R.ctx.lineTo(mx + mr * 1.7, my + mr * 1.55);
    R.ctx.stroke();

    // connecting lines cluster -> money, with flowing particles
    clusterDefs.forEach(function (c, ci) {
      var cx = c.x * w, cy = c.y * h;
      R.ctx.strokeStyle = 'rgba(251,59,36,0.22)';
      R.ctx.lineWidth = 1;
      R.ctx.beginPath();
      R.ctx.moveTo(cx, cy);
      R.ctx.lineTo(mx, my);
      R.ctx.stroke();

      // spawn particle along this line
      if (now - (c._t || 0) > 620 + ci * 90) {
        c._t = now;
        rParticles.push({ cx: cx, cy: cy, t: 0, spd: 0.016 + Math.random() * 0.006 });
      }

      // cluster node (content)
      var nw = Math.max(12, w * 0.055), nh = nw * 0.74;
      roundedNode(R.ctx, cx, cy, nw, nh, 3, 'rgba(0,0,0,0.2)', '#FFFFFF', 1);
      R.ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      R.ctx.lineWidth = 1.3;
      R.ctx.beginPath();
      R.ctx.moveTo(cx - nw/2 + 3, cy - nh/2 + 4);
      R.ctx.lineTo(cx + nw/2 - 3, cy - nh/2 + 4);
      R.ctx.stroke();
    });

    // flowing particles into money node
    for (var i = rParticles.length - 1; i >= 0; i--) {
      var p = rParticles[i];
      p.t += p.spd;
      if (p.t >= 1) { rParticles.splice(i, 1); pulse = 1; continue; }
      var px = p.cx + (mx - p.cx) * p.t;
      var py = p.cy + (my - p.cy) * p.t;
      R.ctx.beginPath();
      R.ctx.arc(px, py, 2, 0, Math.PI * 2);
      R.ctx.fillStyle = ACCENT;
      R.ctx.fill();
    }

    // money page node (accent, glowing, pulses on arrival)
    if (pulse > 0) pulse = Math.max(0, pulse - 0.05);
    var glow = 0.35 + pulse * 0.4 + Math.sin(now / 600) * 0.06;
    R.ctx.beginPath();
    R.ctx.arc(mx, my, mr + 5 + pulse * 4, 0, Math.PI * 2);
    R.ctx.fillStyle = 'rgba(251,59,36,' + (0.10 * glow).toFixed(3) + ')';
    R.ctx.fill();

    roundedNode(R.ctx, mx, my, mr * 1.7, mr * 1.7, mr * 0.42, null, ACCENT, 0);
    // upward arrow glyph (money/authority rising)
    R.ctx.strokeStyle = '#fff';
    R.ctx.lineWidth = 2.2;
    R.ctx.lineCap = 'round';
    R.ctx.lineJoin = 'round';
    var a = mr * 0.5;
    R.ctx.beginPath();
    R.ctx.moveTo(mx, my + a * 0.7);
    R.ctx.lineTo(mx, my - a * 0.7);
    R.ctx.moveTo(mx - a * 0.55, my - a * 0.15);
    R.ctx.lineTo(mx, my - a * 0.7);
    R.ctx.lineTo(mx + a * 0.55, my - a * 0.15);
    R.ctx.stroke();

    requestAnimationFrame(drawRight);
  }

  function onResize() { L.dims = L.resize(); R.dims = R.resize(); }
  window.addEventListener('resize', onResize);

  requestAnimationFrame(drawLeft);
  requestAnimationFrame(drawRight);
})();
</script>
</body>
</html>
