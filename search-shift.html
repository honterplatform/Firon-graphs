<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: #000;
    letter-spacing: -0.01em;
  }

  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: stretch; justify-content: center;
    padding: clamp(6px, 1.2vh, 10px);
  }
  .shell {
    width: 100%; height: 100%;
    max-width: 1080px;
    background: #F2F2F2;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    padding: clamp(9px, 1.5vh, 13px);
    display: flex; flex-direction: column;
    gap: clamp(7px, 1.2vh, 11px);
    overflow: hidden;
  }

  /* ---------- header ---------- */
  .top {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0; min-width: 0;
  }
  .tlabel {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: rgba(0,0,0,0.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .legend { margin-left: auto; display: flex; gap: clamp(7px, 1vw, 12px); flex-shrink: 0; }
  .lg {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: clamp(10px, 1.4vh, 12px);
    font-weight: 500;
    color: rgba(0,0,0,0.6);
    white-space: nowrap;
  }
  .sw { width: 9px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .sw.g { background: rgba(0,0,0,0.75); }
  .sw.a { background: #FB3B24; }

  /* ---------- chart ---------- */
  .panel {
    flex: 1; min-height: 0;
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- footer deltas ---------- */
  .foot {
    display: flex; align-items: center; gap: clamp(7px, 1vw, 12px);
    flex-shrink: 0; min-width: 0;
    overflow: hidden;
  }
  .delta {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(9px, 1.25vh, 10.5px);
    font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .delta b {
    font-size: clamp(11px, 1.7vh, 14px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .delta.down b { color: rgba(0,0,0,0.8); }
  .delta.up b { color: #FB3B24; }
  .span {
    margin-left: auto;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: rgba(0,0,0,0.28);
    white-space: nowrap;
  }

  @media (max-width: 560px), (max-aspect-ratio: 1/1) {
    .tlabel { display: none; }
    .legend { margin-left: 0; }
    .span { display: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="shell">

    <header class="top">
      <span class="tlabel">Where buyers start a product search</span>
      <div class="legend">
        <span class="lg"><i class="sw g"></i>Google</span>
        <span class="lg"><i class="sw a"></i>AI assistants</span>
      </div>
    </header>

    <section class="panel"><canvas id="c"></canvas></section>

    <footer class="foot">
      <span class="delta down">Google <b id="dG">0</b> pts</span>
      <span class="delta up">AI assistants <b id="dA">0</b> pts</span>
      <span class="span" id="spanLbl"></span>
    </footer>

  </section>
</main>

<script>
(function () {
  /* ============================================================
     DATA — placeholder shape, not sourced figures.
     Replace with your own researched numbers before publishing,
     and put the citation in SOURCE below (empty renders nothing).
     ============================================================ */
  var YEARS  = ['2021', '2022', '2023', '2024', '2025', '2026'];
  var GOOGLE = [92, 89, 84, 75, 62, 47];
  var AI     = [ 1,  3, 10, 22, 38, 55];
  var SOURCE = '';

  var ACCENT = '#FB3B24';
  var N = YEARS.length;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dG = document.getElementById('dG');
  var dA = document.getElementById('dA');
  var spanLbl = document.getElementById('spanLbl');
  spanLbl.textContent = SOURCE ? SOURCE : YEARS[0] + ' – ' + YEARS[N - 1];

  var W = 0, H = 0, dpr = window.devicePixelRatio || 1;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.max(1, W * dpr);
    canvas.height = Math.max(1, H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ---------- geometry ---------- */
  function pads() {
    var fs = Math.max(8.5, Math.min(11, H * 0.05));
    return { l: fs * 3.1, r: fs * 5.0, t: fs * 1.4, b: fs * 2.5, fs: fs };
  }
  function X(i, p) { return p.l + (i / (N - 1)) * (W - p.l - p.r); }
  function Y(v, p) { return p.t + (1 - v / 100) * (H - p.t - p.b); }

  /* where the two series actually cross */
  var CROSS = (function () {
    for (var i = 0; i < N - 1; i++) {
      var d0 = GOOGLE[i] - AI[i], d1 = GOOGLE[i + 1] - AI[i + 1];
      if (d0 === 0) return { i: i, v: GOOGLE[i] };
      if ((d0 > 0) !== (d1 > 0)) {
        var t = d0 / (d0 - d1);
        return { i: i + t, v: GOOGLE[i] + t * (GOOGLE[i + 1] - GOOGLE[i]) };
      }
    }
    return null;
  })();

  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function seg(e, a, b) { return clamp01((e - a) / (b - a)); }
  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  /* ---------- drawing ---------- */
  function polyline(data, prog, p) {
    var pts = [], cur = prog * (N - 1), last = Math.floor(cur);
    for (var i = 0; i <= Math.min(last, N - 1); i++) pts.push([X(i, p), Y(data[i], p)]);
    if (last < N - 1) {
      var f = cur - last;
      pts.push([
        X(last, p) + f * (X(last + 1, p) - X(last, p)),
        Y(data[last], p) + f * (Y(data[last + 1], p) - Y(data[last], p))
      ]);
    }
    return pts;
  }

  function strokePts(pts, color, lw) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function fillUnder(pts, color, p) {
    if (pts.length < 2) return;
    var base = Y(0, p);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], base);
    for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(pts[pts.length - 1][0], base);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function chip(x, y, text, bg, fg, p) {
    ctx.font = '500 ' + p.fs + 'px "Geist Mono", ui-monospace, monospace';
    var w = ctx.measureText(text).width + p.fs * 1.1;
    var h = p.fs * 1.8, r = 4;
    ctx.beginPath();
    ctx.moveTo(x + r, y - h / 2);
    ctx.arcTo(x + w, y - h / 2, x + w, y + h / 2, r);
    ctx.arcTo(x + w, y + h / 2, x, y + h / 2, r);
    ctx.arcTo(x, y + h / 2, x, y - h / 2, r);
    ctx.arcTo(x, y - h / 2, x + w, y - h / 2, r);
    ctx.closePath();
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + 0.5);
  }

  function draw(e) {
    var p = pads();
    ctx.clearRect(0, 0, W, H);

    var aGrid = ease(seg(e, 0, 400));
    var prog  = ease(seg(e, 300, 1700));
    var aCross = ease(seg(e, 1750, 2150));
    var aEnd  = ease(seg(e, 2150, 2500));
    var aOut  = 1 - seg(e, 7600, 8000);
    ctx.globalAlpha = aOut;

    /* grid */
    ctx.font = '500 ' + (p.fs * 0.92) + 'px "Geist Mono", ui-monospace, monospace';
    ctx.textBaseline = 'middle';
    [0, 25, 50, 75, 100].forEach(function (v) {
      var y = Y(v, p);
      ctx.beginPath();
      ctx.moveTo(p.l, y);
      ctx.lineTo(W - p.r, y);
      ctx.strokeStyle = 'rgba(0,0,0,' + (0.055 * aGrid).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (v % 50 === 0) {
        ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * aGrid).toFixed(3) + ')';
        ctx.textAlign = 'right';
        ctx.fillText(v + '%', p.l - p.fs * 0.7, y);
      }
    });

    /* x labels */
    var everyOther = W < 430;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    YEARS.forEach(function (yr, i) {
      if (everyOther && i % 2 === 1 && i !== N - 1) return;
      ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * aGrid).toFixed(3) + ')';
      ctx.fillText(yr, X(i, p), H - p.b + p.fs * 0.55);
    });

    /* series */
    var gPts = polyline(GOOGLE, prog, p);
    var aPts = polyline(AI, prog, p);
    fillUnder(gPts, 'rgba(0,0,0,0.045)', p);
    fillUnder(aPts, 'rgba(251,59,36,0.08)', p);
    strokePts(gPts, 'rgba(0,0,0,0.78)', 2);
    strokePts(aPts, ACCENT, 2.4);

    /* the crossover — the whole point of the chart */
    if (CROSS && aCross > 0) {
      var cx = X(CROSS.i, p), cy = Y(CROSS.v, p);
      ctx.save();
      ctx.globalAlpha = aOut * aCross;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, H - p.b);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(cx, cy, 4.5 + (1 - aCross) * 6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = ACCENT;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '500 ' + (p.fs * 0.92) + 'px "Geist Mono", ui-monospace, monospace';
      ctx.fillStyle = ACCENT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('CROSSOVER', cx, cy - p.fs * 1.2);
      ctx.restore();
    }

    /* endpoint values, nudged apart so the chips never collide */
    if (aEnd > 0) {
      ctx.save();
      ctx.globalAlpha = aOut * aEnd;
      var ex = X(N - 1, p) + p.fs * 0.8;
      chip(ex, Y(GOOGLE[N - 1], p) + p.fs * 1.1, GOOGLE[N - 1] + '%', '#F2F2F2', 'rgba(0,0,0,0.8)', p);
      chip(ex, Y(AI[N - 1], p) - p.fs * 1.1, AI[N - 1] + '%', ACCENT, '#fff', p);
      ctx.restore();
    }

    ctx.globalAlpha = 1;

    /* footer deltas count up with the reveal */
    var dp = ease(seg(e, 2400, 3200));
    var gd = (GOOGLE[N - 1] - GOOGLE[0]) * dp;
    var ad = (AI[N - 1] - AI[0]) * dp;
    dG.textContent = (gd > 0 ? '+' : '−') + Math.abs(Math.round(gd));
    dA.textContent = (ad >= 0 ? '+' : '−') + Math.abs(Math.round(ad));
  }

  var TOTAL = 8000;
  var start = null;
  function frame(now) {
    if (start === null) start = now;
    draw((now - start) % TOTAL);
    requestAnimationFrame(frame);
  }

  function boot() {
    resize();
    if (reduce) { draw(7000); }
    else requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () {
    resize();
    if (reduce) draw(7000);
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
  else boot();
})();
</script>
</body>
</html>
