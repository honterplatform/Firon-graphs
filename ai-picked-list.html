<style>

  html, body { width: 100%; height: 100%; overflow: hidden; }

    color: #000;
    letter-spacing: -0.01em;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: clamp(6px, 1.2vh, 10px);
  }

  .shell {
    width: 100%;
    height: 100%;
    max-width: 1080px;
    background: #F2F2F2;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 10px;
    padding: clamp(9px, 1.5vh, 13px);
    display: flex;
    flex-direction: column;
    gap: clamp(7px, 1.2vh, 11px);
    overflow: hidden;
  }

  .qbar {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 8px;
    padding: clamp(9px, 1.5vh, 13px) clamp(12px, 1.6vw, 16px);
    flex-shrink: 0;
  }
  .qlabel {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: rgba(0,0,0,0.38);
    display: block;
    margin-bottom: 4px;
  }
  .qline { display: flex; align-items: baseline; min-height: clamp(19px, 2.8vh, 25px); }
  .qtext {
    font-size: clamp(14px, 2.1vh, 19px);
    font-weight: 500;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: clamp(14px, 2vh, 18px);
    background: #FB3B24;
    margin-left: 3px;
    flex-shrink: 0;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ---------- Engine chips ---------- */

    display: flex;
    gap: clamp(5px, 0.7vw, 8px);
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: clamp(28px, 4.2vh, 36px);
    padding: 0 clamp(8px, 1vw, 13px);
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.09);
    border-radius: 6px;
    font-family: 'Geist', sans-serif;
    font-size: clamp(10.5px, 1.4vh, 12.5px);
    font-weight: 500;
    color: rgba(0,0,0,0.55);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    min-width: 0;
  }
  .chip svg { width: clamp(12px, 1.7vh, 14px); height: clamp(12px, 1.7vh, 14px); flex-shrink: 0; }
  .chip svg path { fill: rgba(0,0,0,0.3); transition: fill 0.2s ease; }
  .chip.answered svg path { fill: rgba(0,0,0,0.75); }
  .chip.answered { color: rgba(0,0,0,0.8); }
  .chip.active { border-color: #FB3B24; color: #FB3B24; }
  .chip.active svg path { fill: #FB3B24; }
  .chip:hover { border-color: rgba(0,0,0,0.22); }
  .chip.active:hover { border-color: #FB3B24; }
  .chip .mark {
    width: 11px; height: 11px;
    border-radius: 3px;
    background: rgba(0,0,0,0.25);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .chip.active .mark { background: #FB3B24; }

  /* ---------- Board ---------- */
  .board {
    flex: 1;
    min-height: 0;
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.35s ease;
  }
  .board.out { opacity: 0; }

  .grid {
    display: grid;
    grid-template-columns: clamp(26px, 3.4vw, 38px) minmax(0, 1fr) auto clamp(112px, 17vw, 190px);
    align-items: center;
    gap: clamp(8px, 1.2vw, 14px);
    padding: 0 clamp(12px, 1.6vw, 18px);
  }

  .thead {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: rgba(0,0,0,0.36);
    border-bottom: 1px solid rgba(0,0,0,0.07);
    background: #F2F2F2;
    padding-top: clamp(7px, 1.1vh, 10px);
    padding-bottom: clamp(7px, 1.1vh, 10px);
    flex-shrink: 0;
  }
  .thead .t-share { text-align: right; }

  .rows { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .row {

    min-height: 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.36s ease, transform 0.36s ease;

  .row.in { opacity: 1; transform: translateY(0); }

  .rank {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(11px, 1.6vh, 14px);
    font-weight: 500;
    color: rgba(0,0,0,0.32);
    font-variant-numeric: tabular-nums;
  }
  .row.top .rank { color: #FB3B24; }

  .brand {
    font-size: clamp(12.5px, 1.9vh, 16px);
    font-weight: 600;
    color: rgba(0,0,0,0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.top .brand { color: #000; }

  .eng { display: inline-flex; align-items: center; gap: clamp(4px, 0.6vw, 7px); }
  .eng svg { width: clamp(11px, 1.6vh, 14px); height: clamp(11px, 1.6vh, 14px); }
  .eng svg path { fill: rgba(0,0,0,0.13); }
  .eng svg.on path { fill: rgba(0,0,0,0.72); }

  .track {
    flex: 1;
    min-width: 0;
    height: 5px;
    background: rgba(0,0,0,0.07);
    border-radius: 3px;
    overflow: hidden;
  }
  .fill {
    display: block;
    height: 100%;
    width: 0;
    background: rgba(0,0,0,0.72);
    border-radius: 3px;
    transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .row.top .fill { background: #FB3B24; }
  .pct {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: clamp(10px, 1.4vh, 12px);
    font-weight: 500;
    color: rgba(0,0,0,0.6);
    font-variant-numeric: tabular-nums;
    width: 30px;
    text-align: right;
    flex-shrink: 0;
  }
  .row.top .pct { color: #000; }

  /* ---------- "Your brand" row ---------- */
  .you {
    border-top: 1px dashed rgba(0,0,0,0.16);
    background: rgba(251,59,36,0.035);
    padding-top: clamp(9px, 1.4vh, 13px);
    padding-bottom: clamp(9px, 1.4vh, 13px);
    flex-shrink: 0;
    opacity: 0;
    transform: translateY(6px);

  .you.in { opacity: 1; transform: translateY(0); }
  .you .rank { color: #FB3B24; }
  .you .brand { color: #FB3B24; font-weight: 600; }
  .you .eng svg path { fill: rgba(251,59,36,0.22); }
  .you-tag {
    justify-self: end;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #FB3B24;
    background: rgba(251,59,36,0.1);
    border-radius: 4px;
    padding: 4px 8px;
    white-space: nowrap;
  }

  /* ---------- Footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 9.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(0,0,0,0.38);
    padding: 0 2px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .foot .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #FB3B24;
    animation: pulse 1.7s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ---------- Compact / mobile ---------- */
  @media (max-width: 720px), (max-aspect-ratio: 1/1) {
    .grid {
      grid-template-columns: clamp(20px, 6vw, 28px) minmax(0, 1fr) clamp(86px, 30vw, 130px);
      gap: 8px;
      padding: 0 11px;
    }
    .eng, .thead .t-eng { display: none; }
    .chip span.nm { display: none; }
    .chip { padding: 0 9px; gap: 0; }
    .chip.consensus span.nm { display: inline; }
    .chip.consensus { gap: 6px; }
    .qtext { font-size: 13.5px; }
    .pct { width: 26px; }
  }
  @media (max-width: 400px) {
    .foot .extra { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caret, .foot .dot { animation: none; }
    .row, .you { transition: none; }
    .fill { transition: none; }
  }
</style>

  function sleep(ms, g) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () { g !== gen ? reject(CANCEL) : resolve(); }, ms);
    });
  }

  function typeText(el, text, g) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      el.textContent = '';
      (function step() {
        if (g !== gen) return reject(CANCEL);
        if (i >= text.length) return resolve();
        el.textContent = text.slice(0, ++i);
        setTimeout(step, 24);
      })();
    });
  }

  /* ---------- render ---------- */
  function renderRows(view) {
    rowsEl.innerHTML = '';
    view.slice(0, 5).forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'grid row' + (i === 0 ? ' top' : '');
      row.innerHTML =
        '<span class="rank">' + (i + 1) + '</span>' +
        '<span class="brand">' + r.brand + '</span>' +
        '<span class="eng">' + r.named.map(function (n, k) { return logoSvg(k, !!n); }).join('') + '</span>' +
        '<span class="share"><span class="track"><span class="fill" data-w="' + r.share + '"></span></span>' +
        '<span class="pct">' + r.share + '%</span></span>';
      rowsEl.appendChild(row);
    });
  }

  function staticState() {
    var cat = CATEGORIES[curCat];
    qtext.textContent = cat.q;
    caret.classList.add('off');
    catName.textContent = cat.cat;
    renderRows(viewFor(cat, curEngine));
    Array.prototype.forEach.call(rowsEl.children, function (row) {
      row.classList.add('in');
      var f = row.querySelector('.fill');
      f.style.width = f.getAttribute('data-w') + '%';
    });
    chipEls.forEach(function (el) { el.classList.add('answered'); });
    youEl.classList.add('in');
  }

  /* ---------- main sequence ---------- */
  async function run() {
    var g = ++gen;
    try {
      while (true) {
        var cat = CATEGORIES[curCat];

        // reset
        board.classList.remove('out');
        rowsEl.innerHTML = '';
        youEl.classList.remove('in');
        clearAnswered();
        caret.classList.remove('off');
        catName.textContent = cat.cat;

        // 1. type the buyer prompt
        await typeText(qtext, cat.q, g);
        await sleep(260, g);

        // 2. engines answer, one by one
        var order = curEngine < 0 ? [0, 1, 2, 3] : [curEngine];
        for (var e = 0; e < order.length; e++) {
          chipEls[order[e] + 1].classList.add('answered');
          await sleep(170, g);
        }
        caret.classList.add('off');
        await sleep(200, g);

        // 3. the list assembles
        var view = viewFor(cat, curEngine);
        renderRows(view);
        var rowNodes = Array.prototype.slice.call(rowsEl.children);
        for (var i = 0; i < rowNodes.length; i++) {
          rowNodes[i].classList.add('in');
          (function (node) {
            var f = node.querySelector('.fill');
            requestAnimationFrame(function () { f.style.width = f.getAttribute('data-w') + '%'; });
          })(rowNodes[i]);
          await sleep(130, g);
        }

        // 4. the stake: your brand isn't on it
        await sleep(520, g);
        youEl.classList.add('in');

        // 5. hold, then next category
        await sleep(3400, g);
        board.classList.add('out');
        await sleep(400, g);
        curCat = (curCat + 1) % CATEGORIES.length;
      }
    } catch (err) {
      if (err !== CANCEL) throw err;
    }
  }

  if (reduce) {
    staticState();
  } else {
    run();
  }
})();
</script>
</body>
</html>
